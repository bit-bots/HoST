[workspace]
authors = ["Lea Wedmann <wedmann.lea@gmail.com>"]
channels = ["main", "r", "msys2"]
name = "host"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.8.*"
tensorboard = ">=2.12.1,<3"
tqdm = "*"
seaborn = "*"
setuptools = "<60"
ipython = ">=8.12.2,<9"
numpy = "<1.24"
tensorflow = ">=2.4.1,<3"

[pypi-dependencies]
torch = { version = "==1.10.0+cu113", index = "https://download.pytorch.org/whl/cu113" }
torchvision = { version = "==0.11.1+cu113", index = "https://download.pytorch.org/whl/cu113" }
torchaudio = { version = "==0.10.0+cu113", index = "https://download.pytorch.org/whl/cu113" }
isaacgym = { path = "isaacgym/python", editable = true }
rsl_rl = { path = "rsl_rl", editable = true }
legged_gym = { path = "legged_gym", editable = true}
numpy = "<1.24"

[activation.env]
LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
